[project]
name = "orqelis-agent-windows"
version = "0.1.0"
description = "Orqelis endpoint agent for Windows, macOS, and Linux — telemetry only"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
orqelis-agent = "orqelis_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orqelis_agent*"]
