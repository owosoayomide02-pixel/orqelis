[project]
name = "orqelis-security"
version = "0.1.0"
description = "Password hashing, tokens, validation, and redaction helpers"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.2.0",
  "PyJWT>=2.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orqelis_security*"]
