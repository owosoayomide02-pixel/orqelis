[project]
name = "orqelis-shared"
version = "0.1.0"
description = "Shared Orqelis enums, constants, and schemas"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orqelis_shared*"]
