[project]
name = "orqelis-api"
version = "0.1.0"
description = "Orqelis V1 FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "httpx>=0.28.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.18",
  "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../detection", "../ai", "../../packages/security", "../../packages/shared"]
testpaths = ["tests"]
