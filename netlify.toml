# Website + dashboard (apps/web). Host the FastAPI API on Render.

[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_ADMIN_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
